<!DOCTYPE html>
<html lang="en-IN" class="h-full antialiased" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#09090b" />
  <meta name="color-scheme" content="dark light" />

  <title>Artist — GULLYGANG Universal Music Discovery</title>
  <meta name="description" content="Explore songs, albums, and discography on GULLYGANG." />
  <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />

  <!-- Open Graph -->
  <meta property="og:type" content="music.musician" />
  <meta property="og:site_name" content="GULLYGANG" />
  <meta property="og:title" content="Artist — GULLYGANG Music" />
  <meta property="og:description" content="Explore songs, albums, and discography on GULLYGANG." />
  <meta property="og:image" content="https://gullygang.in/brand-cover.png" />

  <!-- Favicons -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

  <!-- Typography Preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" />

  <!-- Stylesheet -->
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="min-h-screen bg-[#09090b] text-white flex flex-col selection:bg-[var(--accent)] selection:text-black">
  <!-- Top Global Header -->
  <header class="sticky top-0 z-40 w-full border-b border-white/5 bg-[#09090b]/80 backdrop-blur-xl">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-4">
      <a href="/" class="flex items-center gap-2 group">
        <span class="text-lg font-black tracking-tighter text-white group-hover:text-[var(--accent)] transition-colors">GULLYGANG</span>
      </a>

      <div class="flex items-center gap-3">
        <button type="button" class="btn-music-search-trigger inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-white/5 hover:bg-white/10 border border-white/10 text-xs text-white/70 hover:text-white transition-all">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <span class="hidden sm:inline">Search music...</span>
          <kbd class="hidden sm:inline-block px-1.5 py-0.5 text-[10px] font-mono bg-white/10 rounded">⌘K</kbd>
        </button>
        <a href="/blog" class="text-xs font-semibold text-white/70 hover:text-white transition-colors px-2 py-1">Journal</a>
      </div>
    </div>
  </header>

  <!-- Background Video Canvas & Audio Hosts -->
  <div class="fixed inset-0 pointer-events-none -z-10 overflow-hidden opacity-30">
    <div id="bg-yt-player"></div>
  </div>
  <div class="hidden" aria-hidden="true">
    <div id="yt-player"></div>
  </div>

  <!-- Main View Container -->
  <main id="app-router-view" class="flex-1 pb-32" data-page="artist">
    <div id="artist-page-container"></div>
  </main>

  <!-- Persistent Queue Preview Panel -->
  <div id="playlist-preview-backdrop" class="playlist-preview-backdrop hidden" aria-hidden="true"></div>
  <aside id="playlist-preview-panel" class="playlist-preview-panel hidden" aria-label="Current Playlist Queue" aria-hidden="true">
    <div class="playlist-preview-drag-bar" aria-hidden="true"></div>
    <div class="playlist-preview-header">
      <div class="playlist-preview-header-info">
        <div class="playlist-preview-eyebrow">NOW PLAYING QUEUE</div>
        <div class="playlist-preview-title-row">
          <h2 id="playlist-preview-title" class="playlist-preview-title">GULLYGANG Station</h2>
          <span id="playlist-preview-count-badge" class="playlist-preview-count-badge">0 SONGS</span>
        </div>
      </div>
      <button type="button" id="btn-close-playlist-preview" class="playlist-preview-close-btn" aria-label="Close Playlist Queue">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
    <div id="playlist-preview-list" class="playlist-preview-list" role="listbox" tabindex="0" aria-label="Track list"></div>
  </aside>

  <!-- Persistent Player Dock -->
  <div id="player-dock-persistent" class="player-dock-fixed" role="region" aria-label="Music Player Controls">
    <div class="player-dock-inner">
      <div class="player-dock-left">
        <div class="player-dock-thumb-wrap">
          <img id="dock-thumb" src="https://gullygang.in/brand-cover.png" alt="Current Track" class="player-dock-thumb" />
        </div>
        <div class="player-dock-meta">
          <div id="dock-title" class="player-dock-title">GULLYGANG</div>
          <div id="dock-artist" class="player-dock-artist">Select a track</div>
        </div>
      </div>

      <div class="player-dock-center">
        <div class="player-dock-buttons">
          <button type="button" id="btn-shuffle" class="player-dock-btn" aria-label="Shuffle playback" title="Shuffle">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg>
          </button>
          <button type="button" id="btn-prev" class="player-dock-btn" aria-label="Previous track" title="Previous">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2"></line></svg>
          </button>
          <button type="button" id="btn-play" class="player-dock-btn player-dock-play-btn" aria-label="Play or Pause" title="Play">
            <svg id="play-icon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
          </button>
          <button type="button" id="btn-next" class="player-dock-btn" aria-label="Next track" title="Next">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2"></line></svg>
          </button>
          <button type="button" id="btn-repeat" class="player-dock-btn" aria-label="Repeat mode" title="Repeat">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg>
          </button>
        </div>

        <div class="player-dock-progress-row">
          <span id="dock-current-time" class="player-dock-time">0:00</span>
          <div id="dock-rail" class="player-dock-rail" role="slider" aria-label="Seek track" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
            <div id="dock-fill" class="player-dock-fill" style="width: 0%;"></div>
            <div id="dock-thumb-handle" class="player-dock-thumb-handle" style="left: 0%;"></div>
          </div>
          <span id="dock-duration" class="player-dock-time">0:00</span>
        </div>
      </div>

      <div class="player-dock-right" id="player-right-controls">
        <button type="button" id="btn-playlist-preview" class="player-dock-btn" aria-label="Current Playlist Queue" title="Current Playlist Queue">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
        </button>
        <div class="player-dock-vol-wrap">
          <button type="button" id="btn-vol" class="player-dock-btn" aria-label="Mute or unmute volume" title="Volume">
            <svg id="vol-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
          </button>
          <input type="range" id="vol-slider" class="player-dock-vol-slider" min="0" max="1" step="0.01" value="1" aria-label="Volume Level" />
        </div>
      </div>
    </div>
  </div>

  <!-- Universal YouTube Music Search Modal (Step 15) -->
  <div id="music-search-backdrop" class="music-search-backdrop hidden" aria-hidden="true"></div>
  <div id="music-search-modal" class="music-search-modal hidden" role="dialog" aria-modal="true" aria-label="Music Search">
    <div class="music-search-dialog-inner">
      <div class="music-search-header">
        <div class="music-search-input-wrap">
          <svg class="music-search-input-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="search" id="music-search-input" class="music-search-input" placeholder="Search songs, artists, albums, videos..." aria-label="Search songs, artists, albums" autocomplete="off" spellcheck="false" role="combobox" aria-autocomplete="list" aria-expanded="false" />
          <button type="button" id="music-search-clear" class="music-search-clear-btn hidden" aria-label="Clear search">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          </button>
          <kbd class="music-search-esc-badge hidden sm:inline-block">ESC</kbd>
        </div>
        <button type="button" id="btn-close-music-search" class="music-search-close-btn" aria-label="Close search">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <div id="music-search-suggestions" class="music-search-suggestions hidden" role="listbox"></div>
      <div class="music-search-filters">
        <button type="button" class="music-search-filter-btn is-active" data-filter="all" aria-pressed="true">All</button>
        <button type="button" class="music-search-filter-btn" data-filter="songs" aria-pressed="false">Songs</button>
        <button type="button" class="music-search-filter-btn" data-filter="artists" aria-pressed="false">Artists</button>
        <button type="button" class="music-search-filter-btn" data-filter="albums" aria-pressed="false">Albums</button>
        <button type="button" class="music-search-filter-btn" data-filter="videos" aria-pressed="false">Videos</button>
      </div>
      <div id="music-search-results" class="music-search-results" tabindex="-1"></div>
    </div>
  </div>

  <script src="/weather-effects.js"></script>
  <script src="/app.js"></script>
</body>
</html>
